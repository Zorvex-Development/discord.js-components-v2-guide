
name: Import Components V2 Handbook ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP filename in repository root"
        required: true
        default: "zorvex-components-v2-handbook.zip"
        type: string

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$ZIP_NAME" || "$ZIP_NAME" != *.zip || "$ZIP_NAME" == */* ]]; then
            echo "ZIP not found in repository root: $ZIP_NAME"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT

          python3 - "$ZIP_NAME" "$STAGE" <<'PY'
          import pathlib
          import re
          import stat
          import sys
          import zipfile

          archive_name, destination = sys.argv[1], pathlib.Path(sys.argv[2])

          with zipfile.ZipFile(archive_name) as archive:
              for entry in archive.infolist():
                  name = entry.filename
                  path = pathlib.PurePosixPath(name)
                  mode = (entry.external_attr >> 16) & 0o170000

                  if (
                      not name
                      or path.is_absolute()
                      or ".." in path.parts
                      or "\\" in name
                      or re.match(r"^[A-Za-z]:", name)
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name!r}")

                  if ".git" in path.parts or mode == stat.S_IFLNK:
                      raise SystemExit(f"Rejected ZIP entry: {name!r}")

              archive.extractall(destination)
          PY

          mapfile -t entries < <(
            find "$STAGE" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )

          SOURCE="$STAGE"

          if (( ${#entries[@]} == 1 )) &&
             [[ -d "$STAGE/${entries[0]}" ]]; then
            SOURCE="$STAGE/${entries[0]}"
          fi

          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            "$SOURCE/" ./

          rm -- "$ZIP_NAME"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: import Components V2 handbook"
          git push origin "HEAD:${GITHUB_REF_NAME}"
